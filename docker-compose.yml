name: apollo-sfs

# All services run on app-network (internal Docker bridge).
# Only the API port is bound to 127.0.0.1 so Nginx on the host can proxy to it.
#
# MinIO is the only service whose data is bind-mounted to NVMe storage. Its data
# lives on the mergerfs pool that unions nvme-01 + nvme-02 into one JBOD volume
# (capacity, no redundancy). The pool must be mounted before the first
# `docker compose up` — it is mounted at boot via /etc/fstab. Full drive + pool
# setup is documented in docs/nvme_capacity_expansion.md.
#
# All other persistent data (PostgreSQL) uses standard named Docker volumes
# managed under the Docker data root.
#
# Place the Keycloak realm import JSON at ./keycloak/import/realm-export.json
# before first boot — Keycloak imports it once, then skips on subsequent starts.

services:

  # ── Frontend ───────────────────────────────────────────────────────────────
  # Vite build output served by nginx:alpine.
  # Bound to 127.0.0.1 only — the host nginx proxies inbound HTTPS traffic here.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: apollo-sfs-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend (Go) test runner sidecar ──────────────────────────────────────
  # Runs `go test ./tests/... -count=1` via cmd/testserver on the internal bridge.
  #   POST /run-tests  — Go unit tests
  # The API calls this endpoint to trigger the suite.
  # This service is NOT present in production — remove or comment it out there.
  api-tests:
    build:
      context: ./api
      dockerfile: Dockerfile.test
    platform: linux/arm64
    container_name: apollo-sfs-api-tests
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── Frontend test runner sidecar ──────────────────────────────────────────
  # Runs Jest and Playwright via test-server.js on the internal Docker bridge.
  #   POST /run-tests  — Jest unit tests
  #   POST /run-e2e    — Playwright E2E tests (Chromium, headless)
  # The API calls these endpoints to trigger the suites.
  # This service is NOT present in production — remove or comment it out there.
  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    platform: linux/arm64
    container_name: apollo-sfs-frontend-tests
    restart: unless-stopped
    environment:
      # Playwright connects to the already-running frontend nginx container
      # instead of spinning up a Vite dev server inside the sidecar.
      PLAYWRIGHT_BASE_URL: http://frontend:80
    depends_on:
      - frontend
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── App API ────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: apollo-sfs-api
    restart: unless-stopped
    # privileged + user: root are required for the remote kill switch endpoint.
    # The kill switch escapes the container cgroup, enters host namespaces via
    # nsenter, runs `docker compose down`, then powers off the host.
    # Remove both if you don't need remote shutdown capability.
    privileged: true
    user: root
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Used by the kill switch to identify the Compose stack to stop.
      COMPOSE_PROJECT_NAME: apollo-sfs
      # PostgreSQL — app DB
      POSTGRES_APP_HOST: db-app
      POSTGRES_APP_PORT: 5432
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB}
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_USE_SSL: "false"
      # Keycloak
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8180
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Encryption
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      GIN_MODE: release
      # Session
      SESSION_KEY: ${SESSION_KEY}
      # Cookies & session
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_BASE_URL: ${APP_BASE_URL}
      # Email — Postfix submission point (internal Docker only)
      POSTFIX_INTERNAL_HOST: postfix:587
      MAIL_FROM: ${MAIL_FROM}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      # Inbound email — SendGrid Inbound Parse stores parsed messages on disk
      # under this path (mounted from the host's ~/service-worker-email below).
      # SENDGRID_WEBHOOK_SECRET guards the public webhook via a ?token= param.
      EMAIL_STORAGE_PATH: /home/app/service-worker-email
      SENDGRID_WEBHOOK_SECRET: ${SENDGRID_WEBHOOK_SECRET:-}
      QUOTA_WARNING_THRESHOLD_PERCENT: ${QUOTA_WARNING_THRESHOLD_PERCENT:-80}
      DISK_STATS_PATH: /data
      DISK_STATS_DRIVE_LABEL: nvme-pool
      # Cloudflare Turnstile — bot protection for the interest form
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY}
      CLOUDFLARE_TURNSTILE_SITE_KEY: ${CLOUDFLARE_TURNSTILE_SITE_KEY}
      # Premium tier + SFS S3-like API + PayPal
      # SFS_API_KEY_PEPPER: ≥ 32 random bytes mixed into the argon2id hash
      # of every API key so a DB leak cannot be brute-forced offline.
      SFS_API_KEY_PEPPER: ${SFS_API_KEY_PEPPER}
      # PayPal Orders v2 credentials. PAYPAL_ENV: "sandbox" or "live".
      # PAYPAL_WEBHOOK_ID is required for signature verification on the
      # /api/v1/payments/webhook endpoint — see docs/paypal_setup.md.
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      # Aliases used by binaries built before the SANDBOX_* → PAYPAL_* rename.
      # Safe to remove after all containers have been rebuilt with the new config.
      SANDBOX_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      SANDBOX_PAYPAL_SECRET_KEY: ${PAYPAL_CLIENT_SECRET:-}
      SANDBOX_PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_OAUTH_CLIENT_SECRET:-}
      PREMIUM_TIER_PRICE_CENTS: ${PREMIUM_TIER_PRICE_CENTS:-999}
      PREMIUM_TIER_CURRENCY: ${PREMIUM_TIER_CURRENCY:-USD}
      # Test runners — point at the sidecar containers on the Docker bridge.
      BACKEND_TEST_URL: http://api-tests:9228/run-tests
      FRONTEND_TEST_URL: http://frontend-tests:9229/run-tests
      FRONTEND_E2E_URL: http://frontend-tests:9229/run-e2e
      # AI recognition is Swarm-only (see docker-stack.yml). RECOGNITION_URL is
      # deliberately unset here, which disables the feature and its worker.
    volumes:
      # Read-only mount of the mergerfs pool (nvme-01 + nvme-02) so the API's
      # disk-stats reader reports COMBINED capacity. See docs/nvme_capacity_expansion.md.
      - /home/apollo/apollo-sfs/minio/pool:/data:ro
      # Per-drive live stats (metrics page → Infrastructure). The drive-stats
      # endpoint auto-discovers each drive's mount by its filesystem label and
      # reads live capacity/used/free. For that to work for drives OTHER than the
      # pool, the API must see the host's individual drive mounts and the
      # /dev/disk/by-label symlinks the discovery resolves labels through.
      #
      # 1) Storage tree mounted read-only at the SAME host path so each drive's
      #    mount point exists in the container and statfs works. rslave
      #    propagation lets the container observe drives mounted/unmounted on the
      #    host after start (otherwise only mounts present at container start are
      #    visible — fine for boot-time fstab mounts).
      - type: bind
        source: /home/apollo/apollo-sfs/minio
        target: /home/apollo/apollo-sfs/minio
        read_only: true
        bind:
          propagation: rslave
      # 2) Filesystem-label symlinks (label → block device) used to map a drive's
      #    label to its mount. The block-device targets resolve via the host /dev
      #    that `privileged: true` already exposes. Drives whose label/mount can't
      #    be resolved simply report online=false and fall back to stored capacity.
      - /dev/disk/by-label:/dev/disk/by-label:ro
      - /var/lib/GeoIP:/var/lib/GeoIP:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Inbound email store — host dir persists messages across container rebuilds.
      - ${HOME}/service-worker-email:/home/app/service-worker-email
    depends_on:
      db-app:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_healthy
      postfix:
        condition: service_started
      api-tests:
        condition: service_started
      frontend-tests:
        condition: service_started
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Node metrics ingest ────────────────────────────────────────────────────
  # Dev equivalent of the Swarm node-metrics-ingest service: the internal
  # ingest endpoint per-node agents push to, isolated from the api service.
  node-metrics-ingest:
    build:
      context: ./api
      dockerfile: Dockerfile.node-metrics-ingest
    platform: linux/arm64
    container_name: apollo-sfs-node-metrics-ingest
    restart: unless-stopped
    environment:
      POSTGRES_APP_HOST: db-app
      POSTGRES_APP_PORT: 5432
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB}
      NODE_AGENT_TOKEN: ${NODE_AGENT_TOKEN:-dev-node-agent-token}
    depends_on:
      db-app:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Node metrics agent ─────────────────────────────────────────────────────
  # Single-node dev equivalent of the Swarm "global" node-agent. Reads this
  # host's CPU/memory/network/drive sensors and pushes them to the API so the
  # admin metrics page shows a populated per-node view in local development.
  node-agent:
    build:
      context: ./api
      dockerfile: Dockerfile.node-agent
    platform: linux/arm64
    container_name: apollo-sfs-node-agent
    restart: unless-stopped
    environment:
      NODE_HOSTNAME: ${NODE_HOSTNAME:-apollo-sfs-dev-node-1}
      NODE_METRICS_INGEST_URL: http://node-metrics-ingest:8080
      NODE_AGENT_TOKEN: ${NODE_AGENT_TOKEN:-dev-node-agent-token}
    volumes:
      - /sys:/sys:ro
      - /dev/disk/by-label:/dev/disk/by-label:ro
      - type: bind
        source: /home/apollo/apollo-sfs/minio
        target: /home/apollo/apollo-sfs/minio
        read_only: true
        bind:
          propagation: rslave
    depends_on:
      node-metrics-ingest:
        condition: service_started
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── MinIO object storage ───────────────────────────────────────────────────
  # Encrypted file blobs are stored here. Data is bind-mounted to the mergerfs
  # pool at /home/apollo/apollo-sfs/minio/pool, which unions nvme-01 + nvme-02
  # into one JBOD volume (capacity, no redundancy). See
  # docs/nvme_capacity_expansion.md for the drive/pool setup.
  # Port 9000 is internal only — accessed by the API on the Docker network.
  # Port 9001 (MinIO console) is NOT exposed to the host; access via SSH tunnel
  # during setup if needed: ssh -L 9001:localhost:9001 <pi>
  minio:
    image: minio/minio:latest
    platform: linux/arm64
    container_name: apollo-sfs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Keycloak auth server ───────────────────────────────────────────────────
  # Never exposed publicly — the API communicates with it on the internal network.
  # Realm import: place realm JSON files in ./keycloak/import/ before first boot.
  keycloak:
    # Keycloak does not publish floating major-version tags — always use a full
    # semver. Check the latest release at https://www.keycloak.org/downloads
    image: quay.io/keycloak/keycloak:26.0.7
    platform: linux/arm64
    container_name: apollo-sfs-keycloak
    restart: unless-stopped
    # Bound to 127.0.0.1 only — access via SSH tunnel, never exposed publicly
    ports:
      - "127.0.0.1:8180:8180"
    command: start --import-realm
    environment:
      # Database backend
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db-keycloak:5432/${POSTGRES_KC_DB}
      KC_DB_USERNAME: ${POSTGRES_KC_USER}
      KC_DB_PASSWORD: ${POSTGRES_KC_PASSWORD}
      # HTTP (TLS terminated by Nginx on the host)
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8180
      KC_HTTPS_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
      # Full URL including protocol — KC 26 requires this, not a bare hostname.
      # Keycloak has its own hostname so the admin console and realm endpoints are
      # served at their native paths (see the auth.apollo-sfs.com nginx vhost).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_STRICT: "true"
      # Trust X-Forwarded-* headers set by Nginx
      KC_PROXY_HEADERS: xforwarded
      # No KC_FEATURES needed: all social login (web + mobile, Google + Apple) uses
      # identity-provider brokering (standard OIDC Authorization Code flow), not the
      # deprecated token-exchange grant. Re-add KC_FEATURES only if a future feature
      # requires it.
      # Bootstrap admin credentials (Keycloak 26+)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Limit JVM heap — important on a memory-constrained Pi
      JAVA_OPTS_APPEND: -Xms256m -Xmx512m
    volumes:
      # Realm JSON files are imported on first boot, then skipped if realm exists
      - ./keycloak/import:/opt/keycloak/data/import:ro
      # Third-party identity provider JARs — mounted into Keycloak's providers dir
      - ./keycloak/providers:/opt/keycloak/providers:ro
      # Custom login + email theme (apollo-sfs). Read at runtime; restart Keycloak
      # to pick up changes (themes are cached in the start/production profile).
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      db-keycloak:
        condition: service_healthy
    healthcheck:
      # Port 9000 is Keycloak 26's dedicated management port — health endpoints
      # are always available here regardless of any KC_HEALTH_ENABLED setting
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/live HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep 'HTTP/1.1 200 OK' <&3"]
      interval: 30s
      timeout: 15s
      retries: 10
      # Keycloak JVM startup is slow on a Pi — give it plenty of time
      start_period: 180s
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Postfix SMTP relay ─────────────────────────────────────────────────────
  # Internal submission hub only — accepts mail from the API and Keycloak on
  # port 587, then relays outbound through SendGrid. Never exposed to the host.
  # boky/postfix is multi-arch (amd64 + arm64) and configures Postfix as a
  # pure relay via environment variables — no config file needed.
  postfix:
    image: boky/postfix:latest
    platform: linux/arm64
    container_name: apollo-sfs-postfix
    restart: unless-stopped
    environment:
      # Accept submissions from the internal Docker network only
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN}
      RELAYHOST: smtp.sendgrid.net:587
      RELAYHOST_USERNAME: apikey
      RELAYHOST_PASSWORD: ${SENDGRID_SMTP_PASSWORD}
      # Match the From address used by the API
      POSTFIX_myhostname: ${MAIL_DOMAIN}
    volumes:
      - ./docker/postfix:/var/spool/postfix
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Cloudflare DDNS ────────────────────────────────────────────────────────
  # Polls your public IP every 5 minutes and updates the Cloudflare A record.
  # Uses a scoped API token with DNS-edit-only permission (never full zone access).
  ddns:
    image: favonia/cloudflare-ddns:latest
    platform: linux/arm64
    container_name: apollo-sfs-ddns
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CF_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Apex plus the Keycloak subdomain — both A records track the dynamic IP.
      DOMAINS: ${CLOUDFLARE_RECORD_NAME},${KEYCLOAK_PUBLIC_HOST}
      PROXIED: "true"
      IP6_PROVIDER: "none"
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL — app metadata DB ───────────────────────────────────────────
  db-app:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: apollo-sfs-postgresql-app
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_DB: ${POSTGRES_APP_DB}
    volumes:
      - ./docker/postgresql-app:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER} -d ${POSTGRES_APP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL — Keycloak DB ───────────────────────────────────────────────
  db-keycloak:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: apollo-sfs-postgresql-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KC_DB}
    volumes:
      - ./docker/postgresql-keycloak:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_KC_USER} -d ${POSTGRES_KC_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  # Bind-mounted to the mergerfs pool (nvme-01 + nvme-02) — this is where
  # uploaded file blobs live. The pool must be mounted before `docker compose up`
  # (it is mounted at boot via /etc/fstab). See docs/nvme_capacity_expansion.md.
  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/apollo/apollo-sfs/minio/pool

