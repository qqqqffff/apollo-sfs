# Apollo SFS login theme. Extends Keycloak 26's default login theme (keycloak.v2)
# and only adds brand overrides, so future Keycloak updates to the base theme are
# inherited automatically.
#
# `styles` is additive here: css/styles.css resolves to the parent's compiled
# stylesheet, and css/custom.css (ours) loads after it so our rules win.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/custom.css

# Where the page overrides send a user who lands on Keycloak-rendered UI. All
# authentication UI lives in the React app; see bounce.ftl. Keep in sync with
# APP_BASE_URL — a mismatch strands users on Keycloak rather than bouncing them.
appUrl=https://apollo-sfs.com
