server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ES module scripts (the pdf.js worker Vite emits for src/utils/pdfWorker.ts)
    # must be served with a JavaScript Content-Type — browsers refuse to
    # execute a module Worker/import() otherwise, unconditionally (this check
    # isn't gated by X-Content-Type-Options: nosniff, so that header can't be
    # the workaround). nginx's stock mime.types has no `.mjs` entry, so
    # without this, `.mjs` files fall through to `default_type
    # application/octet-stream` and every PDF preview fails, on every client,
    # via the worker's own fake-worker fallback re-fetching the same
    # wrongly-typed URL. Regex locations are matched in file order and the
    # first match wins — this must come before the `^/assets/` block below
    # since both match `/assets/*.mjs`.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Vite content-hashed assets — cache for 1 year (immutable)
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA catch-all — let React Router handle all non-asset paths
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
