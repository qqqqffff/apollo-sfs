<!doctype html>
<!--
  Microsoft OAuth redirect target for the email backup feature.
  The sign-in popup lands here with ?code=&state= (or ?error=) in the query
  string; this page relays them to the opener (same-origin only) and closes.
  See frontend/src/api/emailProviders.ts (requestMicrosoftAccessToken).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signing in…</title>
</head>
<body>
  <p style="font-family: sans-serif; color: #6b7280; text-align: center; margin-top: 4rem;">
    Completing sign-in…
  </p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search)
      var payload = {
        type: 'ms-oauth-callback',
        code: params.get('code'),
        state: params.get('state'),
        error: params.get('error'),
        errorDescription: params.get('error_description'),
      }
      if (window.opener) {
        window.opener.postMessage(payload, window.location.origin)
      }
      window.close()
    })()
  </script>
</body>
</html>
