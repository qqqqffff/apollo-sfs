# When the client sends an Upgrade header (WebSocket), pass Connection: upgrade;
# otherwise send Connection: close so regular HTTP proxying is unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apollo-sfs.com;

    # ── TLS — Cloudflare Origin Certificate ───────────────────────────────────
    # Generate at: Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
    # Set SSL/TLS mode to Full (Strict) in Cloudflare so the edge always
    # validates this cert against the origin.
    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── IP blocklist ──────────────────────────────────────────────────────────
    # Drop connections from explicitly blocked IPs.
    # Add deny rules to files under /etc/nginx/blocklist.d/ e.g.:
    #   deny 1.2.3.4;
    #   deny 10.0.0.0/8;
    include /etc/nginx/blocklist.d/*.conf;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Restrict what content the browser may load or execute.
    # - script-src: accounts.google.com added for Google Identity Services (GIS)
    # - script-src/connect-src/frame-src/img-src: *.paypal.com + *.paypalobjects.com
    #   for the PayPal JS SDK (react-paypal-js). The SDK script, its button
    #   iframes, XHR telemetry/session calls, and button assets all load from
    #   these hosts — without them every PayPalScriptProvider surface (storage
    #   add-ons, expansion deposits, premium, invoices) fails to render in BOTH
    #   sandbox and live, regardless of backend credentials.
    # - script-src/frame-src: challenges.cloudflare.com for Cloudflare Turnstile
    #   (interest form bot protection).
    # - script-src/frame-src/connect-src: pay.google.com for Google Pay (PayPal's
    #   Googlepay() orchestration loads Google's pay.js and opens the payment
    #   sheet from there; PayPal is still the processor). img-src *.gstatic.com +
    #   pay.google.com for the Google Pay button/card artwork.
    # - img-src: *.googleusercontent.com for Drive thumbnail previews
    # - frame-src: accounts.google.com for GIS intermediate OAuth iframe
    # - connect-src: Google APIs for Drive, Photos Picker, and OAuth token exchange
    # - style-src 'self' 'unsafe-inline': Tailwind and component inline styles
    # - media-src 'self': video/audio streaming endpoint
    # - object-src 'none': block Flash and other plugins entirely
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://pay.google.com https://*.paypal.com https://*.paypalobjects.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com https://pay.google.com https://*.paypal.com https://*.paypalobjects.com; frame-src 'self' https://accounts.google.com https://pay.google.com https://*.paypal.com https://challenges.cloudflare.com; media-src 'self'; connect-src 'self' https://accounts.google.com https://pay.google.com https://google.com https://www.google.com https://www.googleapis.com https://photospicker.googleapis.com https://*.googleusercontent.com https://*.paypal.com https://*.paypalobjects.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Universal Links / App Links — served before the SPA catch-all ─────────
    # apple-app-site-association (iOS Universal Links) and assetlinks.json
    # (Android App Links) must be at /.well-known/ with Content-Type:
    # application/json and without a redirect, so they are served from static
    # files rather than proxied to the React SPA.
    location /.well-known/ {
        alias /etc/nginx/well-known/.well-known/;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ── Keycloak ──────────────────────────────────────────────────────────────
    # Keycloak is served on its own hostname (auth.apollo-sfs.com, see the server
    # block below) so its admin console and realm endpoints live at the paths it
    # natively expects, with no path rewriting. Nothing Keycloak-related is served
    # under apollo-sfs.com anymore.

    # ── React SPA — proxied to the frontend container ─────────────────────────
    # Caching and try_files are handled by the container's nginx config.
    location / {
        # US-only gate, scoped to this location (not the server block) so it
        # never applies to /.well-known/ above — see the map in nginx.conf.
        if ($geo_block) { return 444; }

        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── File-server mounts (WebDAV, premium) → Go container ───────────────────
    # Mount clients (Windows Explorer, macOS Finder, davfs2, mobile file
    # managers) speak WebDAV against /dav/<token>. Same upstream as /api/,
    # with the same upload streaming and generous transfer timeouts.
    location /dav/ {
        if ($geo_block) { return 444; }

        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream upload bodies straight to the Go API.
        proxy_request_buffering off;

        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 10s;

        client_max_body_size 500M;
        client_body_timeout 3600s;
    }

    # ── API proxy → Go container ───────────────────────────────────────────────
    location /api/ {
        if ($geo_block) { return 444; }

        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (used by /api/v1/admin/system/metrics/stream).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Do not buffer request bodies — stream uploads directly to the Go API
        # so large files don't need to land on disk twice.
        proxy_request_buffering off;

        # Generous timeouts for large file uploads and downloads.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 10s;

        # Allow uploads up to 500 MB. Adjust to match the per-user quota ceiling.
        client_max_body_size 500M;

        # Per-chunk read timeout: resets on every received body chunk, so a slow
        # but active upload will never be dropped. 3600s covers even the worst
        # real-world connections without timing out legitimate uploads.
        client_body_timeout 3600s;

        # ── Auth endpoints — rate limited ──────────────────────────────────────
        # 10 req/min per IP, burst of 10. Supplements Keycloak's brute-force
        # detection as a first line of defence at the network edge.
        location /api/v1/auth/ {
            if ($geo_block) { return 444; }

            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 1M;
        }

        # ── Internal-only endpoints — never reachable from the public edge ──────
        # /api/v1/internal/* is the node-agent → API ingest channel. Agents reach
        # the API directly over the Docker overlay network; nginx must not proxy
        # these. Return 404 so the surface is indistinguishable from an unknown path.
        location /api/v1/internal/ {
            return 404;
        }
    }
}

# ── www — canonicalizes to the apex ─────────────────────────────────────────────
# Not an app-facing host — exists only because PayPal's Apple Pay domain
# verification (and payment-processor domain checks generally) probe both the
# apex and the www variant of a registered domain. www.apollo-sfs.com must have
# a DNS record pointing here (CNAME to apollo-sfs.com is simplest — it then
# tracks the ddns-managed apex IP automatically, no separate DDNS entry needed)
# and the origin cert must cover it (wildcard *.apollo-sfs.com, or add
# www.apollo-sfs.com as an explicit SAN alongside auth.apollo-sfs.com).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.apollo-sfs.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/blocklist.d/*.conf;

    # Served directly here (not redirected) and with no GeoIP gate — same file,
    # same alias as the apex. Some domain-verification crawlers don't follow
    # redirects for the file they're checking, and may not call from a US IP,
    # so this has to 200 on its own rather than bounce to the apex.
    location /.well-known/ {
        alias /etc/nginx/well-known/.well-known/;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Everything else canonicalizes to the apex (still US-only).
    location / {
        if ($geo_block) { return 444; }
        return 301 https://apollo-sfs.com$request_uri;
    }
}

# ── Keycloak — dedicated hostname ───────────────────────────────────────────────
# auth.apollo-sfs.com proxies straight through to Keycloak (:8180) with no path
# rewriting, so the admin console, realm/OIDC endpoints, theme resources and the
# keycloak.js adapter are all served at the paths Keycloak expects. KC_HOSTNAME is
# set to https://auth.apollo-sfs.com so every self-referential URL Keycloak emits
# (token iss, login form actions, admin consoleBaseUrl, reset-password email links)
# points here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.apollo-sfs.com;

    # Same Cloudflare Origin Certificate as the apex — it must cover this subdomain
    # (use a wildcard *.apollo-sfs.com cert, or add auth.apollo-sfs.com as a SAN).
    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Same IP blocklist and US-only GeoIP gate as the apex host.
    include /etc/nginx/blocklist.d/*.conf;
    if ($geoip2_country_code != "US") {
        return 444;
    }

    # No app CSP / X-Frame-Options here — those break the Keycloak admin console.
    # Keycloak sets its own security headers on responses; we only add HSTS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8180;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name apollo-sfs.com www.apollo-sfs.com auth.apollo-sfs.com;
    return 301 https://$host$request_uri;
}
