# ─────────────────────────────────────────────────────────────────────────────
# Docker Swarm stack — two-node, two-tier deployment.
# NOTE: no top-level `name:` here — `docker stack deploy` uses the legacy Compose
# v3 schema which rejects it ("Additional property name is not allowed"). The
# stack name comes from the CLI arg: `docker stack deploy ... apollo-sfs`.
#
#   manager  apollo-sfs-1 (Ryzen, amd64, node.labels.tier=standard)
#            → api, frontend, keycloak, postfix, ddns, db-app, db-keycloak,
#              minio-standard (8TB HDD).  Host nginx terminates TLS in front.
#   worker   apollo-sfs   (Pi 5, arm64,  node.labels.tier=fast)
#            → minio-fast (existing 4TB NVMe blobs — reused in place).
#
# Deploy (see docs/registry_setup.md for the full registry workflow):
#   Each custom image is pinned by its OWN tag variable (API_TAG, FRONTEND_TAG,
#   NODE_AGENT_TAG, NODE_METRICS_INGEST_TAG, RECOGNITION_TAG, TEST_RUNNER_TAG) —
#   NOT a single shared TAG. This is what lets you
#   rebuild/redeploy just one service: point ONLY that service's variable at a
#   newly built+pushed tag, and set the other two variables to whatever tag is
#   already running (query with `docker service inspect --format
#   '{{.Spec.TaskTemplate.ContainerSpec.Image}}' apollo-sfs_api`, etc.) so they
#   redeploy unchanged instead of silently pointing at a tag that was never
#   pushed for them.
#
#   ./deploy.sh   automates exactly this (see docs/registry_setup.md), including
#   resolving the untouched services' tags live from the running Swarm. Manual
#   equivalent for a frontend-only change:
#
#   export REGISTRY=192.168.68.57:5000          # private registry endpoint
#   export TAG=$(git rev-parse --short HEAD)
#   docker buildx build --platform linux/amd64 \
#     -t ${REGISTRY}/apollo-sfs_frontend:${TAG} frontend/ --push
#   export FRONTEND_TAG=${TAG}
#   export API_TAG=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' apollo-sfs_api | sed 's/.*://')
#   export NODE_AGENT_TAG=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' apollo-sfs_node-agent-standard | sed 's/.*://')
#   set -a && . ./.env && set +a                 # stack deploy does NOT auto-read .env
#   docker stack deploy -c docker-stack.yml apollo-sfs   # nodes pull from the registry
#
# REGISTRY, API_TAG, FRONTEND_TAG, NODE_AGENT_TAG, NODE_METRICS_INGEST_TAG,
# RECOGNITION_TAG, and TEST_RUNNER_TAG must all be set before
# `docker stack deploy` — they are substituted from the shell environment (not
# from .env). REGISTRY defaults to 192.168.68.57:5000 (the manager's LAN IP)
# when unset; the TAG vars have no default, so a missing one fails the
# deploy loudly (intentional — better than silently deploying an unpushed tag).
# Because every node pulls the versioned image from the registry, you no longer
# build on each node or pass --resolve-image never.
#
# NOTE — three Swarm differences vs docker-compose, all called out below:
#   * `build:` is unsupported → images are pre-built (Part 1 of the doc).
#   * `privileged:`/`pid: host` are unsupported → the API kill switch cannot run
#     as a Swarm service (see the api service comment).
#   * published ports use `mode: host` so they bind only on the pinned node; the
#     host firewall must block 3000/8080/8180 from outside (see the doc, Part 4).
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Frontend (React/Vite, served by nginx:alpine) ───────────────────────────
  frontend:
    image: ${REGISTRY:-192.168.68.57:5000}/apollo-sfs_frontend:${FRONTEND_TAG}
    ports:
      - target: 80
        published: 3000
        protocol: tcp
        mode: host          # binds 3000 on the manager only; host nginx proxies here
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      update_config:
        parallelism: 1
        order: stop-first   # host-mode ports can't coexist; must stop old task before starting new one
        failure_action: rollback
        delay: 5s
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── App API (Go/Gin) ─────────────────────────────────────────────────────────
  # ⚠ The remote kill switch needs `privileged` + host namespaces, which Swarm
  #   services do NOT support. Options:
  #     (a) accept that the kill switch is inert here (everything else works), or
  #     (b) run the API as a standalone privileged container attached to the
  #         attachable overlay instead of in this stack:
  #           docker run -d --name apollo-sfs_api --privileged --user root \
  #             --network app-network --env-file .env ... apollo-sfs_api:amd64
  api:
    image: ${REGISTRY:-192.168.68.57:5000}/apollo-sfs_api:${API_TAG}
    user: root
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host          # binds 8080 on the manager only
    environment:
      COMPOSE_PROJECT_NAME: apollo-sfs
      # PostgreSQL — app DB
      POSTGRES_APP_HOST: db-app
      POSTGRES_APP_PORT: 5432
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB}
      # Encryption / session
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      SESSION_KEY: ${SESSION_KEY}
      GIN_MODE: release
      # MinIO — REQUIRED by the API (cmd/config.go requireEnv). This is the
      # bootstrap/default endpoint; per-server creds for additional tiers are
      # stored encrypted in the DB. Points at the fast-tier service named `minio`
      # (matches the existing server record — see doc Part 6).
      MINIO_ENDPOINT: minio:9000
      # Standard-tier MinIO endpoint, used by the on-demand infrastructure sync to
      # discover the standard-tier server/drive (same root credentials).
      MINIO_STANDARD_ENDPOINT: minio-standard:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_USE_SSL: "false"
      # Keycloak
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8180
      # Browser-facing Keycloak origin. Used only to build the brokered social
      # sign-in redirect (GET /auth/social/start) — every server-to-server call
      # still goes over the overlay network via KEYCLOAK_INTERNAL_URL.
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Cookies & base URL
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_BASE_URL: ${APP_BASE_URL}
      # Email
      POSTFIX_INTERNAL_HOST: postfix:587
      MAIL_FROM: ${MAIL_FROM}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      EMAIL_STORAGE_PATH: /home/app/service-worker-email
      SENDGRID_WEBHOOK_SECRET: ${SENDGRID_WEBHOOK_SECRET:-}
      QUOTA_WARNING_THRESHOLD_PERCENT: ${QUOTA_WARNING_THRESHOLD_PERCENT:-80}
      # Local drive stats — the standard (HDD) tier is on this node.
      # Per-server/per-drive topology is stored in the DB (admin API); see the doc.
      DISK_STATS_PATH: /data
      DISK_STATS_DRIVE_LABEL: hdd-01
      # Cloudflare Turnstile
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY}
      CLOUDFLARE_TURNSTILE_SITE_KEY: ${CLOUDFLARE_TURNSTILE_SITE_KEY}
      # Premium tier / SFS API / PayPal
      SFS_API_KEY_PEPPER: ${SFS_API_KEY_PEPPER}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      # Second, always-sandbox PayPal app — backs the admin-only "sandbox
      # payments" session toggle (profile page). Empty disables the toggle.
      PAYPAL_SANDBOX_CLIENT_ID: ${PAYPAL_SANDBOX_CLIENT_ID:-}
      PAYPAL_SANDBOX_CLIENT_SECRET: ${PAYPAL_SANDBOX_CLIENT_SECRET:-}
      PAYPAL_SANDBOX_WEBHOOK_ID: ${PAYPAL_SANDBOX_WEBHOOK_ID:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_OAUTH_CLIENT_SECRET:-}
      PREMIUM_TIER_PRICE_CENTS: ${PREMIUM_TIER_PRICE_CENTS:-999}
      PREMIUM_TIER_CURRENCY: ${PREMIUM_TIER_CURRENCY:-USD}
      # AI recognition sidecar (premium face/pet/object indexing). Empty
      # RECOGNITION_URL disables the feature and the background worker.
      RECOGNITION_URL: http://recognition:8000
      RECOGNITION_TOKEN: ${RECOGNITION_TOKEN:-}
      # Unified test-runner sidecar backing the admin metrics page's "Run
      # tests" button. Swarm-only — see the test-runner service below.
      TEST_RUNNER_URL: http://test-runner:9228/run-tests
      # Server local time zone (IANA name, e.g. America/New_York). Used by the
      # daily MinIO/Postgres reconciliation heartbeat, which fires at 4am in
      # this zone — see docs/storage_reconciliation.md. tzdata is installed in
      # the image (Dockerfile); defaults to UTC if unset.
      TZ: ${TZ:-UTC}
    volumes:
      # Local HDD (standard tier) for disk-stats reads
      - /srv/minio/hdd-01:/data:ro
      - /var/lib/GeoIP:/var/lib/GeoIP:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/apollo/service-worker-email:/home/app/service-worker-email
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      update_config:
        parallelism: 1
        order: stop-first   # host-mode port 8080 can only be held by one task at a time
        failure_action: rollback
        delay: 5s
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── MinIO — FAST tier (Pi NVMe, existing blobs reused in place) ──────────────
  # Named `minio` (not `minio-fast`) on purpose: it matches the API's required
  # MINIO_ENDPOINT and the existing DB server record's endpoint (`minio:9000`),
  # so no DB edit is needed. The label `nvme-01` is what classifies it as the
  # `nvme`/fast tier (drive_type derives from the label — see doc Part 6).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      # The Pi's EXISTING data dir — do NOT wipe; existing buckets/objects live here.
      # pool/ is the mergerfs union mount; user files are at its top level (no /data subdir).
      - /home/apollo/apollo-sfs/minio/pool:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == fast]     # → the Pi
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── MinIO — STANDARD tier (manager 8TB HDD) ──────────────────────────────────
  minio-standard:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /srv/minio/hdd-01/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]   # → the manager
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start --import-realm
    ports:
      - target: 8180
        published: 8180
        protocol: tcp
        mode: host
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db-keycloak:5432/${POSTGRES_KC_DB}
      KC_DB_USERNAME: ${POSTGRES_KC_USER}
      KC_DB_PASSWORD: ${POSTGRES_KC_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8180
      KC_HTTPS_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
      # Keycloak's OWN public hostname (https://auth.apollo-sfs.com), NOT the app's.
      # Using APP_BASE_URL here makes KC redirect auth.apollo-sfs.com → apollo-sfs.com/admin.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_PUBLIC_URL}
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # The Ryzen has plenty of RAM — raise the JVM heap vs the Pi's old limit.
      JAVA_OPTS_APPEND: -Xms512m -Xmx1024m
    volumes:
      - /home/apollo/apollo-sfs/keycloak/import:/opt/keycloak/data/import:ro
      - /home/apollo/apollo-sfs/keycloak/providers:/opt/keycloak/providers:ro
      # Custom login/email theme (realm.json sets "loginTheme": "apollo-sfs").
      # Themes load at runtime — no kc.sh build needed (unlike providers).
      - /home/apollo/apollo-sfs/keycloak/themes:/opt/keycloak/themes:ro
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Postfix SMTP relay ───────────────────────────────────────────────────────
  postfix:
    image: boky/postfix:latest
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN}
      RELAYHOST: smtp.sendgrid.net:587
      RELAYHOST_USERNAME: apikey
      RELAYHOST_PASSWORD: ${SENDGRID_SMTP_PASSWORD}
      POSTFIX_myhostname: ${MAIL_DOMAIN}
    volumes:
      - /home/apollo/apollo-sfs/docker/postfix:/var/spool/postfix
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Cloudflare DDNS ──────────────────────────────────────────────────────────
  ddns:
    image: favonia/cloudflare-ddns:latest
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      CF_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Keep BOTH the apex and the Keycloak subdomain's A records pointed at us.
      DOMAINS: ${CLOUDFLARE_RECORD_NAME},${KEYCLOAK_PUBLIC_HOST}
      PROXIED: "true"
      IP6_PROVIDER: "none"
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── PostgreSQL — app metadata DB ─────────────────────────────────────────────
  db-app:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_DB: ${POSTGRES_APP_DB}
    volumes:
      - /home/apollo/apollo-sfs/docker/postgresql-app:/var/lib/postgresql/data
      - /home/apollo/apollo-sfs/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER} -d ${POSTGRES_APP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── PostgreSQL — Keycloak DB ─────────────────────────────────────────────────
  db-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_KC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KC_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KC_DB}
    volumes:
      - /home/apollo/apollo-sfs/docker/postgresql-keycloak:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_KC_USER} -d ${POSTGRES_KC_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── AI recognition sidecar — internal inference service (faces/pets/objects) ─
  # Stateless: the api decrypts media server-side and POSTs plaintext bytes
  # here (X-Internal-Token auth); this container never sees keys, the DB, or
  # MinIO. Overlay-only, never proxied by nginx. Pinned to the Ryzen manager
  # (amd64 — broadest ONNX Runtime support; the Pi only runs minio-fast).
  #
  # resources.limits implements the recognition resource pool: set
  # RECOGNITION_CPU_LIMIT / RECOGNITION_MEM_LIMIT to ~50% of the node's
  # cores/RAM so indexing can never starve the rest of the stack. These are
  # the stack's first/only resource limits — every other service is unlimited.
  # To enable a future NVIDIA GPU see docs/ai_recognition_setup.md (build
  # recognition/Dockerfile.cuda, advertise the GPU as a Swarm generic
  # resource, and add a generic_resources reservation here).
  recognition:
    image: ${REGISTRY:-192.168.68.57:5000}/apollo-sfs_recognition:${RECOGNITION_TAG}
    environment:
      # Shared secret authenticating api → sidecar analyze calls.
      RECOGNITION_TOKEN: ${RECOGNITION_TOKEN:-}
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "${RECOGNITION_CPU_LIMIT:-6}"
          memory: ${RECOGNITION_MEM_LIMIT:-16G}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Unified test-runner sidecar — backs the admin "Run tests" button ────────
  # One container carrying Go, Node, and Python toolchains that runs the
  # backend/frontend/frontend-E2E/mobile/recognition suites in sequence and
  # returns one combined JSON report over its own HTTP API (POST /run-tests,
  # see test-runner/CLAUDE.md). The api service proxies that report via
  # TEST_RUNNER_URL above. Swarm-only, like recognition — the deprecated
  # docker-compose.yml has no test-runner service, so the admin panel's "Run
  # tests" button is inert under compose. Pinned to the Ryzen manager (amd64
  # only — same reasoning as recognition: heaviest CPU/RAM footprint of any
  # image, and the Playwright E2E leg needs to reach the live `frontend`
  # container over the overlay network).
  test-runner:
    image: ${REGISTRY:-192.168.68.57:5000}/apollo-sfs_test-runner:${TEST_RUNNER_TAG}
    environment:
      # Playwright connects to the already-running frontend container instead
      # of spinning up a dev server inside the sidecar.
      PLAYWRIGHT_BASE_URL: http://frontend:80
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Node metrics ingest — internal ingest endpoint for per-node agent pushes ─
  # Isolated from the public api service: its own image, its own Swarm service,
  # manager-only, reachable only over the overlay network (never proxied by
  # nginx). See api/cmd/node-metrics-ingest.
  node-metrics-ingest:
    image: ${REGISTRY:-192.168.68.57:5000}/apollo-sfs_node-metrics-ingest:${NODE_METRICS_INGEST_TAG}
    environment:
      POSTGRES_APP_HOST: db-app
      POSTGRES_APP_PORT: 5432
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB}
      # Shared secret authenticating per-node agent pushes.
      NODE_AGENT_TOKEN: ${NODE_AGENT_TOKEN}
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Node metrics agent — standard tier (manager, HDD) ───────────────────────
  # Reads this node's CPU/memory/network/HDD sensors and pushes to the API.
  # Only mounts paths that exist on the manager; see node-agent-fast for the Pi.
  node-agent-standard:
    image: ${REGISTRY:-192.168.68.57:5000}/apollo-sfs-node-agent:${NODE_AGENT_TAG}
    environment:
      NODE_HOSTNAME: "{{.Node.Hostname}}"
      NODE_METRICS_INGEST_URL: http://node-metrics-ingest:8080
      NODE_AGENT_TOKEN: ${NODE_AGENT_TOKEN}
      # Physical disks to report, as label:/mount/point (comma-separated). These
      # point at the bind-mounted data dirs below, so usage is readable inside the
      # container without resolving /dev/disk/by-label symlinks (whose block-device
      # targets under /dev are not mounted into the agent).
      NODE_DISK_MOUNTS: "hdd-01:/srv/minio/hdd-01"
      # Writable scratch directory for the on-demand drive benchmark (see
      # docs/drive_benchmark_setup.md) — a small, dedicated subdirectory, not a
      # blanket reopening of the read-only data mount above. The host path
      # must be created once (`mkdir -p /srv/minio/hdd-01/.bench`) before
      # deploying; it is never read by anything else.
      NODE_BENCHMARK_MOUNTS: "hdd-01:/bench/hdd-01"
    volumes:
      - /sys:/sys:ro
      - /dev/disk/by-label:/dev/disk/by-label:ro
      - /srv/minio/hdd-01:/srv/minio/hdd-01:ro
      - /srv/minio/hdd-01/.bench:/bench/hdd-01
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == standard]
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Node metrics agent — fast tier (Pi 5, NVMe) ──────────────────────────────
  # Reads the Pi's CPU/memory/network/NVMe sensors and pushes to the API.
  # Only mounts paths that exist on the Pi; see node-agent-standard for the manager.
  node-agent-fast:
    image: ${REGISTRY:-192.168.68.57:5000}/apollo-sfs-node-agent:${NODE_AGENT_TAG}
    environment:
      NODE_HOSTNAME: "{{.Node.Hostname}}"
      NODE_METRICS_INGEST_URL: http://node-metrics-ingest:8080
      NODE_AGENT_TOKEN: ${NODE_AGENT_TOKEN}
      # Physical disks to report, as label:/mount/point (comma-separated). The two
      # NVMe drives are bind-mounted below, so usage is readable inside the
      # container without resolving /dev/disk/by-label symlinks (whose block-device
      # targets under /dev are not mounted into the agent).
      NODE_DISK_MOUNTS: "nvme-01:/home/apollo/apollo-sfs/minio/nvme-01,nvme-02:/home/apollo/apollo-sfs/minio/nvme-02"
      # Writable scratch directories for the on-demand drive benchmark (see
      # docs/drive_benchmark_setup.md) — a small, dedicated subdirectory per
      # physical NVMe, not a blanket reopening of the read-only data mounts
      # above. Both host paths must be created once (`mkdir -p .../.bench`)
      # before deploying; neither is read by anything else.
      NODE_BENCHMARK_MOUNTS: "nvme-01:/bench/nvme-01,nvme-02:/bench/nvme-02"
    volumes:
      - /sys:/sys:ro
      - /dev/disk/by-label:/dev/disk/by-label:ro
      - /home/apollo/apollo-sfs/minio/nvme-01:/home/apollo/apollo-sfs/minio/nvme-01:ro
      - /home/apollo/apollo-sfs/minio/nvme-02:/home/apollo/apollo-sfs/minio/nvme-02:ro
      - /home/apollo/apollo-sfs/minio/nvme-01/.bench:/bench/nvme-01
      - /home/apollo/apollo-sfs/minio/nvme-02/.bench:/bench/nvme-02
    networks: [app-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.tier == fast]
      restart_policy:
        condition: any
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  app-network:
    driver: overlay
    attachable: true      # lets a standalone privileged `api` container join, if needed
